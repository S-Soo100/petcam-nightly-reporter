[project]
name = "petcam-nightly-reporter"
version = "0.1.0"
description = "야간 윈도우 분석 워커 — motion_clips → 활동 요약 → Slack"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "supabase>=2.7",
    "boto3>=1.34",
    "opencv-python>=4.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# reporter 는 cwd 에서 import (uv run python -m reporter.worker).
# 프로젝트 자체를 빌드/설치 대상으로 보지 않게 — deps 만 동기화.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
